<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Año 07 - Terminal OSINT Simulación</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes Hacker / Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="top-nav">
    <a href="../../index.html" class="back-link">← Volver a la Nave Central (Año 22)</a>
    <span class="year-badge">AÑO 07 / 22</span>
  </nav>

  <main class="terminal-container">
    
    <header class="terminal-header">
      <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="window-title">EAVNY-OSINT-LAB // v2.4.0 (x86_64-cyber-sec)</div>
    </header>

    <!-- Ventana de Salida de Terminal -->
    <div class="terminal-body" id="terminalOutput">
      <div class="log-line system-msg">
        [SYSTEM INITIALIZED] Welcome to Eavny OSINT Virtual Workstation.
      </div>
      <div class="log-line system-msg">
        Type <span class="cmd-highlight">'help'</span> to view available intelligence & recon commands.
      </div>
    </div>

    <!-- Línea de Comandos (Input) -->
    <form class="terminal-input-row" id="commandForm" onsubmit="handleCommand(event)">
      <span class="prompt-user">analyst@cyber-range:~$</span>
      <input type="text" id="cmdInput" class="cmd-input" autocomplete="off" autofocus placeholder="Escribe un comando...">
    </form>

  </main>

  <script src="../../assets/js/jelly.js"></script>
  <script src="main.js"></script>
</body>
</html>
