<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Año 08 - Visualizador de Audio Spectrum</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="top-nav">
    <a href="../../index.html" class="back-link">← Volver a la Nave Central (Año 22)</a>
    <span class="year-badge">AÑO 08 / 22</span>
  </nav>

  <main class="visualizer-container">
    <header class="viz-header">
      <h1>✧ Audio Frequency Visualizer ✧</h1>
      <p>J-Rock & C-Pop Soundwave Spectrum Synthesizer</p>
    </header>

    <!-- Canvas para renderizar las ondas de audio -->
    <div class="canvas-wrapper">
      <canvas id="audioCanvas"></canvas>
    </div>

    <!-- Controles del Reproductor -->
    <div class="player-controls">
      <div class="track-info">
        <span class="track-title" id="trackTitle">Selecciona una pista para sintetizar</span>
      </div>

      <div class="control-buttons">
        <button id="playBtn" class="action-btn">▶ PLAY / PAUSE</button>
        <label for="audioUpload" class="action-btn upload-btn">📁 Cargar MP3</label>
        <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
      </div>

      <audio id="audioElement" crossOrigin="anonymous"></audio>
    </div>
  </main>

  <script src="../../assets/js/jelly.js"></script>
  <script src="main.js"></script>
</body>
</html>
